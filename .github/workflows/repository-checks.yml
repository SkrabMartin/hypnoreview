{
  "name": "Repository checks",
  "on": {
    "push": null,
    "pull_request": null,
    "workflow_dispatch": null
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "documentation": {
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "name": "Check out repository",
          "uses": "actions/checkout@v4",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Validate Phase 0 documentation",
          "shell": "bash",
          "run": "set -euo pipefail\nfor file in README.md .gitignore .editorconfig .github/workflows/repository-checks.yml; do\n  test -s \"$file\"\ndone\nheadings=(\n  'Project Overview' 'Problem Statement' 'Project Goals'\n  'Planned Features' 'System Architecture' 'Technology Stack'\n  'Repository Structure' 'Data Sources' 'Planned Machine Learning Workflow'\n  'Development Roadmap' 'Installation / Getting Started'\n  'Research Limitations and Safety' 'Contributing and License' 'References'\n)\nfor heading in \"${headings[@]}\"; do\n  grep -Fxq \"## $heading\" README.md\ndone\ngrep -Fxq '### Current Repository Structure' README.md\ngrep -Fxq '### Planned Repository Structure' README.md\nif git ls-files --error-unmatch HypnoReview_Projektova_Specifikace.md >/dev/null 2>&1; then\n  echo 'Private specification must remain untracked.' >&2\n  exit 1\nfi\nif git ls-files '*.md' | grep -v -x 'README.md'; then\n  echo 'Only the root README.md may be tracked; other Markdown documents stay local.' >&2\n  exit 1\nfi\n"
        },
        {
          "name": "Test dataset audit invariants (offline)",
          "shell": "bash",
          "run": "python3 -m unittest discover -s tests/unit -p test_dataset_audit.py -v\npython3 -m compileall -q tools tests packages\n"
        }
      ]
    },
    "signals": {
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "name": "Check out repository",
          "uses": "actions/checkout@v4",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Set up Python",
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "name": "Set up uv",
          "uses": "astral-sh/setup-uv@v6"
        },
        {
          "name": "Install locked signal and development dependencies",
          "run": "uv sync --frozen"
        },
        {
          "name": "Run offline unit and synthetic EDF integration tests",
          "run": "uv run --frozen pytest -q"
        },
        {
          "name": "Check scientific and review lint and formatting",
          "run": "uv run --frozen ruff check apps/api migrations tests/e2e/*.py packages tests/integration tests/unit/test_signal_foundation.py tests/unit/test_models.py tests/unit/test_review_engine.py\nuv run --frozen ruff format --check apps/api migrations tests/e2e/*.py packages tests/integration tests/unit/test_signal_foundation.py tests/unit/test_models.py tests/unit/test_review_engine.py"
        },
        {
          "name": "Check scientific and review types",
          "run": "uv run --frozen mypy apps/api packages --follow-imports=silent"
        }
      ]
    },
    "web": {
      "runs-on": "ubuntu-latest",
      "env": {
        "UV_PROJECT_ENVIRONMENT": ".venv-signals"
      },
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "uses": "astral-sh/setup-uv@v6"
        },
        {
          "run": "uv sync --frozen"
        },
        {
          "uses": "actions/setup-node@v4",
          "with": {
            "node-version": "24",
            "cache": "npm",
            "cache-dependency-path": "apps/web/package-lock.json"
          }
        },
        {
          "run": "npm ci --ignore-scripts",
          "working-directory": "apps/web"
        },
        {
          "run": "npm run format:check",
          "working-directory": "apps/web"
        },
        {
          "run": "npm run build",
          "working-directory": "apps/web"
        },
        {
          "run": "npx playwright install --with-deps chromium",
          "working-directory": "apps/web"
        },
        {
          "run": "npm run test:e2e",
          "working-directory": "apps/web"
        }
      ]
    },
    "postgres": {
      "runs-on": "ubuntu-latest",
      "services": {
        "postgres": {
          "image": "postgres:17",
          "env": {
            "POSTGRES_USER": "hypnoreview",
            "POSTGRES_PASSWORD": "ephemeral-ci-only",
            "POSTGRES_DB": "hypnoreview_test"
          },
          "ports": [
            "5432:5432"
          ],
          "options": "--health-cmd pg_isready --health-interval 3s --health-timeout 3s --health-retries 20"
        }
      },
      "env": {
        "HYPNOREVIEW_DATABASE_URL": "postgresql+psycopg://hypnoreview:ephemeral-ci-only@localhost:5432/hypnoreview_test",
        "HYPNOREVIEW_TEST_DATABASE_URL": "postgresql+psycopg://hypnoreview:ephemeral-ci-only@localhost:5432/hypnoreview_test"
      },
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "uses": "astral-sh/setup-uv@v6"
        },
        {
          "run": "uv sync --frozen"
        },
        {
          "run": "uv run --frozen alembic upgrade head"
        },
        {
          "run": "uv run --frozen alembic check"
        },
        {
          "run": "uv run --frozen pytest -q tests/integration/test_reviewer_api.py"
        }
      ]
    }
  }
}
